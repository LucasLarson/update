---
name: Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    if: ${{ !contains(github.event.head_commit.message, 'update changelog') }}
    steps:
      - uses: actions/checkout@v6 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1 # zizmor: ignore[unpinned-uses]
        with:
          ruby-version: 4.0.5
      - name: Install `github_changelog_generator`
        run: |
          gem install github_changelog_generator
      - name: Install `markdownlint`
        run: |
          npm install markdownlint
          npm install markdownlint-cli
      - name: Build and commit changelog
        run: |
          file="$(
            cd "$(
              # attempt relative-path access
              git rev-parse \
                --path-format=relative \
                --show-toplevel
              )" 2>/dev/null ||
              cd "$(
                git rev-parse \
                --show-toplevel
              )" ||
              exit "${?:-1}"
            # find the Markdown changelog with the latest commit
            find -- "${PWD%/}" \
              -path "${PWD%/}"'/[Cc][Hh][Aa][Nn][Gg][Ee]*[Ll][Oo][Gg]*' \
              -path '.[Mm]*[Dd]*' \
              -type f \
              -exec sh -c '
          git log \
            --max-count=1 \
            --pretty=tformat:'\''%at '\''"${1-}"
              ' _ {} ';' |
              LC_ALL='C' sort -n -r |
              sed \
                -n \
                -e '1s/.*\///g' \
                -e '1p' \
                -e 'q'
          )"
          # define changelog location if none is found
          file="${file:=changelog.md}"
          # ensure the file exists
          touch -- "${file-}"
          # create local changes
          github_changelog_generator \
            --user "$(
              git ls-remote --get-url |
                sed \
                  -e '# replace colons with forward slashes' \
                  -e 's/:/\//g' \
                  -e '# remove everything except the second-to-last' \
                  -e '# forward slash-delimited field' \
                  -e 's/.*\/\([^/]*\)\/[^/]*/\1/'
            )" \
            --project "$(
              git ls-remote --get-url |
                sed \
                  -e 's/.*\///' \
                  -e 's/\.git$//'
            )" \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --exclude-labels 'duplicate,question,invalid,wontfix,nodoc' \
            --output "${file-}"
          # repair changelog credit
          sed \
            -e 's/This Changelog/This changelog/' \
            -e 's/automatically generated/\[automatically generated\]()/' \
            -e 's/\]()/\](.\/.github\/workflows\/changelog.yml)/' \
            -e 's/generator)\*/generator).\*/' \
            ./"${file-}" >./"${file%.*}"_temporary_"${file##*.}" &&
            mv -f -- ./"${file%.*}"_temporary_"${file##*.}" ./"${file-}"
          # lint changelog
          npm exec -- markdownlint --fix -- ./"${file-}" ||
            :
          # commit files
          git config -- user.email 'actions@github.com'
          git config -- user.name 'GitHub'
          git restore --progress --staged -- .
          git add --verbose -- ./"${file-}"
          git commit --verbose --message='update changelog' ||
            exit 0
      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0 # zizmor: ignore[unpinned-uses]
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
